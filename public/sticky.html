<!doctype html>
<html lang="zh-CN">

	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>简悦清单便签</title>
		<style>
			:root {
				color-scheme: light dark;
			}

			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				color: #cdd6f4;
				background: rgba(30, 30, 46, 0.96);
			}

			.boot {
				padding: 16px 18px;
				border-radius: 14px;
				background: rgba(49, 50, 68, 0.9);
				box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
			}
		</style>
	</head>

	<body>
		<div class="boot" id="boot-message">便签启动中…</div>
		<script>
			window.addEventListener('jianyue:sticky-window-init', function () {
				var el = document.getElementById('boot-message');
				if (el) el.textContent = '正在加载便签…';
			});
		</script>
	</body>

</html>
